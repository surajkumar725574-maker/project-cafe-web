<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Payment</title>

    <link rel="stylesheet" href="../style.css">

</head>

<body>

    <!-- ======================================
         PAGE HEADER
    ======================================= -->

    <header>

        <h1>Cafe Checkout</h1>

        <p>
            Review your order and complete payment
        </p>
        <nav class="customer-nav">
    <a href="../index.html">Menu</a>
    <a href="cart.html" class="cart-link">
      🛒
      <span id="cart-count">0</span>
   </a>
    <a href="my-orders.html">Your Orders</a>
</nav>

    </header>


    <!-- ======================================
         MAIN PAYMENT CONTENT
    ======================================= -->

    <main>


        <!-- ==================================
             ORDER SUMMARY SECTION
        =================================== -->

        <section id="order-summary-section">

            <h2>Order Summary</h2>

            <div id="order-summary">

                <!--
                    renderOrderSummary()
                    will render items here

                    Example:

                    Burger x 2
                    Coffee x 1
                -->

            </div>

        </section>


        <!-- ==================================
             TOTAL AMOUNT SECTION
        =================================== -->

        <section id="total-section">


            <div id="total-amount">

                <!--
                    calculateTotal()
                    will render final amount here
                -->

            </div>

        </section>


        <!-- ==================================
             PAYMENT SECTION
        =================================== -->

        <section id="payment-section">

    <div class="payment-bar">

        <div class="payment-total">

            <p>Total Amount</p>

            <h3 id="sticky-total">
                ₹0
            </h3>

        </div>

        <button
            id="pay-now-btn"
            onclick="startPayment()">

            Pay Now

        </button>

    </div>

</section>


        <!-- ==================================
             PAYMENT STATUS SECTION
        =================================== -->

        <section id="payment-status-section">

            <div id="payment-message">

                <!--
                    Success Message

                    Payment Successful

                    or

                    Payment Failed
                -->

            </div>

        </section>


        <button onclick="paymentSuccessHandler()"></button>
    </main>


    <!-- ======================================
         PAYMENT.JS
    ======================================= -->

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script src="payment.js"></script>
</body>

</html>
