<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Order Status</title>

    <link rel="stylesheet" href="../style.css">

</head>

<body>

    <main class="order-status-page">

        <section class="order-status-layout">


            <!-- ===============================
                 LEFT SIDE: ORDER SUMMARY
            ================================ -->

            <div class="order-summary-card">

                <h1>Your Order</h1>

                <p id="status-text">
                    Loading order status...
                </p>

                <h2>Order Summary</h2>

                <div id="order-items">
                    Loading items...
                </div>

            </div>


            <!-- ===============================
                 RIGHT SIDE: ORDER TRACKING
            ================================ -->

            <div class="tracking-card">

                <h2>Order Tracking</h2>

                <div class="timeline">

                    <div class="timeline-step" id="step-new">

                        <div class="timeline-marker">
                            <span class="timeline-dot"></span>
                            <span class="timeline-line"></span>
                        </div>

                        <div class="timeline-content">
                            <h3>Order Placed</h3>
                            <p id="time-new">Waiting...</p>
                        </div>

                    </div>


                    <div class="timeline-step" id="step-accepted">

                        <div class="timeline-marker">
                            <span class="timeline-dot"></span>
                            <span class="timeline-line"></span>
                        </div>

                        <div class="timeline-content">
                            <h3>Accepted</h3>
                            <p id="time-accepted">Pending</p>
                        </div>

                    </div>


                    <div class="timeline-step" id="step-preparing">

                        <div class="timeline-marker">
                            <span class="timeline-dot"></span>
                            <span class="timeline-line"></span>
                        </div>

                        <div class="timeline-content">
                            <h3>Preparing</h3>
                            <p id="time-preparing">Pending</p>
                        </div>

                    </div>


                    <div class="timeline-step" id="step-completed">

                        <div class="timeline-marker">
                            <span class="timeline-dot"></span>
                        </div>

                        <div class="timeline-content">
                            <h3>Completed</h3>
                            <p id="time-completed">Pending</p>
                        </div>

                    </div>


                    <div
                        class="timeline-step cancelled-step"
                        id="step-cancelled"
                    >

                        <div class="timeline-marker">
                            <span class="timeline-dot"></span>
                        </div>

                        <div class="timeline-content">
                            <h3>Cancelled</h3>
                            <p id="time-cancelled">Only shown if cancelled</p>
                        </div>

                    </div>

                </div>

            </div>

        </section>

    </main>

    <script src="../order-status.js"></script>

</body>

</html>
