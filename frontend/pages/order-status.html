<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Status</title>
     <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header>
        <h1>Your Orders</h1>
        <nav class="customer-nav">
    <a href="../index.html">Menu</a>
    <a href="payment.html">Payment</a>
    <a href="order-status.html">Order Status</a>
</nav>
    </header>

    <section id="order-info">
        Loading order...
    </section>

    <section class="timeline">

        <div class="timeline-step" id="step-new">
            <span class="dot"></span>
            <h3>Order Placed</h3>
            <p id="time-new">Pending</p>
        </div>

        <div class="timeline-step" id="step-accepted">
            <span class="dot"></span>
            <h3>Accepted</h3>
            <p id="time-accepted">Pending</p>
        </div>

        <div class="timeline-step" id="step-preparing">
            <span class="dot"></span>
            <h3>Preparing</h3>
            <p id="time-preparing">Pending</p>
        </div>

        <div class="timeline-step" id="step-completed">
            <span class="dot"></span>
            <h3>Completed</h3>
            <p id="time-completed">Pending</p>
        </div>

        <div class="timeline-step" id="step-cancelled">
            <span class="dot"></span>
            <h3>Cancelled</h3>
            <p id="time-cancelled">Pending</p>
        </div>

    </section>

    <section id="order-items">
    </section>

    <script src="order-status.js"></script>

</body>
</html>
