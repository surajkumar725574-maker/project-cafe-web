<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Status</title>
     <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header>
        <h1>Your Orders</h1>
        <nav class="customer-nav">
            <a href="cart.html" class="cart-link">
      🛒
      <span id="cart-count">0</span>
   </a>
    <a href="../index.html">Menu</a>
    <a href="payment.html">Payment</a>
    <a href="my-orders.html">Your Orders</a>
</nav>
    </header>

    <main>

    <section id="order-info">
        Loading order...
    </section>



    <section id="timeline">

        <div class="timeline-step" id="step-new">
            <span class="dot"></span>
            <h3>Order Placed</h3>
            <p id="time-new"></p>
        </div>

        <div class="timeline-step" id="step-accepted">
            <span class="dot"></span>
            <h3>Accepted</h3>
            <p id="time-accepted"></p>
        </div>

        <div class="timeline-step" id="step-preparing">
            <span class="dot"></span>
            <h3>Preparing</h3>
            <p id="time-preparing"></p>
        </div>

        <div class="timeline-step" id="step-completed">
            <span class="dot"></span>
            <h3>Completed</h3>
            <p id="time-completed"></p>
        </div>

        <div class="timeline-step" id="step-cancelled">
            <span class="dot"></span>
            <h3>Cancelled</h3>
            <p id="time-cancelled"></p>
        </div>

    </section>

    <section id="order-items">
    </section>

    </main>

    
    <script src="../util.js"></script>

    <script src="order-status.js"></script>

</body>
</html>
