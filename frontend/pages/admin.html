<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
>
    <title>Admin Page</title>


    <link rel="stylesheet" href="../style.css">
</head>

<body>
 <!-- ===============================
             HEADER
        ================================ -->
    
        <header id="admin-header">

            <button
                class="sidebar-toggle"
                onclick="toggleSidebar()"
            >
                ☰
            </button>

            <h1>Admin Page</h1>

        </header>


        <!-- ===============================
             MAIN CONTENT
        ================================ -->

        <main>


    <!-- ===============================
         ADMIN's sidebar- PANEL
    ================================ -->

    <section id="sidebar-panel">
        <div id="sidebar-overlay" onclick="closeSidebar()"></div>

        <!-- ===============================
             SIDEBAR
        ================================ -->

        <aside id="sidebar">

            <button
                class="sidebar-toggle"
                onclick="toggleSidebar()"
            >
                ☰
            </button>

            <nav  class="sidebar-btns">
                <button onclick="showOrdersSection()">Orders</button>
                <button onclick="showMenuSection()">Manage Menu</button>
                <button onclick="showAddItemSection()">Add Item</button>
                <button onclick="logOutofAdminPanel()">log Out</button>
            </nav>

        </aside>

    </section>

    <!-- ===============================
         ADMIN LOGIN SECTION
    ================================ -->

       <section id="login-section">

        <div class="form-group">

            <h2>Admin Authentication</h2>

            <label for="admin-id">Admin ID</label>
            <input
                id="admin-id"
                placeholder="Enter admin id"
            >

            <label for="password">Passkey</label>
            <input
                id="password"
                type="password"
                placeholder="Enter password"
            >

            <button
                id="login-button"
                onclick="PageLoader()"
            >
                Log in
            </button>

            <p id="message"></p>

        </div>

    </section>

            <!-- ===============================
                 ORDERS SECTION
            ================================ -->
     <section id="orders-section">

    

        <div class="admin-section-heading">
            <h2>Orders</h2>
            <p>Search, track, and update customer orders</p>
        </div>

    


    <!-- ===============================
         SEARCH ORDER
    ================================ -->

    <div id="admin-search-box">

        <input
            id="search-order-id"
            placeholder="Enter Order No or Order ID"
        >

        <button onclick="searchOrderByIdOrNumber()">
            Search
        </button>

 
        
    </div>


    <!-- SEARCH RESULT -->

    <div id="searched-order"></div>


    <!-- ALL ORDERS -->

    <div id="admin-ordered-items"></div>

</section>


            <!-- ===============================
                 MENU MANAGEMENT SECTION
            ================================ -->

            <section id="menu-section">

                <h2>Menu Management</h2>

                <button onclick="showMenuManager()">
                    Manage Menu
                </button>

                <div id="menu-management">
                    <div id="admin-menu-items"></div>
                </div>

            </section>


            <!-- ===============================
                 ADD MENU ITEM SECTION
            ================================ -->

            <section
                id="add-item-section"
                class="form-group"
            >

                <h2>Add Menu Item</h2>

                <label for="item-name">Item Name</label>
                <input
                    id="item-name"
                    placeholder="Enter item name"
                >

                <label for="item-price">Price</label>
                <input
                    id="item-price"
                    type="tel"
                    placeholder="Enter price"
                >

                <label for="item-category">Category</label>
                <input
                    id="item-category"
                    placeholder="Enter category"
                >

                <label for="item-img">image</label>
                <input 
                    id="item-img" type="file"
                    placeholder="add image">

                <button onclick="addItems()">
                    Add Item
                </button>

            </section>

        </main>

   

    <script src="../util.js"></script>

    <script src="admin.js"></script>

</body>

</html>
