 <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Food & Beverages</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ===============================
         HERO / HEADER
    ================================ -->

    <header class="food-header">

        <div class="hero-text">
            <h1>Fresh Food, Fast Orders</h1>

            <p>
                Browse your favourite café items and add them to your cart.
            </p>
        </div>

        <nav class="customer-nav">

   <a href="pages/cart.html" class="cart-link">
      🛒
      <span id="cart-count">0</span>
   </a>

   <a href="pages/payment.html">Payment</a>

   <a href="my-orders.html">Your Orders</a>

</nav>
    </header>


    <!-- ===============================
         SEARCH BAR
    ================================ -->

    <div class="search-section">
<input
 id="search-bar"
 placeholder="search here"
 oninput="searchMenu()">
</div>

    <!-- ===============================
         CATEGORY BAR
         YouTube-style:
         - hides on scroll down
         - appears on scroll up
    ================================ -->

    <section class="category-bar">

        <button onclick="renderMenu('All')">All</button>
        <button onclick="renderMenu('Breakfast')">Breakfast</button>
        <button onclick="renderMenu('Lunch')">Lunch</button>
        <button onclick="renderMenu('Beverages')">Beverages</button>
        <button onclick="renderMenu('Burgers')">Burgers</button>
        <button onclick="renderMenu('Chinese')">Chinese</button>
        <button onclick="renderMenu('Rolls')">Rolls</button>
        <button onclick="renderMenu('Juices')">Juices</button>
        <button onclick="renderMenu('Shakes')">Shakes</button>

    </section>

    <!-- this section is for the bottom button which shows quantity and continue buttton that redirects user to cart page -->
     <section id="continue-bar">

    <div id="bottom-card">
        <p id="item-count">
        </p>

        <a href="./pages/cart.html">
            <button>Continue</button>
        </a>
    </div>

</section>


    <!-- ===============================
         MENU CARDS
    ================================ -->

    <main>

        <div id="menu-items"
             class="menu-grid">

            <!-- food.js renders cards here -->

        </div>


    </main>


    <script src="food.js"></script>

</body>

</html>
